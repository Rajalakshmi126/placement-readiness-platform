<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Placement Readiness Platform</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
  <header class="container navbar">
    <a href="/index.html" class="brand" style="text-decoration:none;"><span class="brand-mark"></span> Placement Readiness</a>
    <nav class="nav-links">
      <a href="/pages/register.html">Create account</a>
    </nav>
  </header>

  <main class="main">
    <div class="container">
      <div class="auth-shell card">
        <span class="eyebrow">Welcome back</span>
        <h2>Log in</h2>
        <div id="error" class="error-banner"></div>
        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@college.edu">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
          <p class="center mt-16">Forgot Password?
<a href="/pages/forgot-password.html">Forgot Password?</a>
</p>
        </form>
        <p class="center mt-24" style="font-size:0.85rem;">No account yet? <a href="/pages/register.html">Register here</a></p>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    try {
      const { token, user } = await Api.login({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      Api.setSession(token, user);
      window.location.href = '/pages/dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
