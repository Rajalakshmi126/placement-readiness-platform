<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Placement Readiness Platform</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page">
  <header class="container navbar">
    <a href="/index.html" class="brand" style="text-decoration:none;"><span class="brand-mark"></span> Placement Readiness</a>
    <nav class="nav-links">
      <a href="/pages/login.html">Log in</a>
    </nav>
  </header>

  <main class="main">
    <div class="container">
      <div class="auth-shell card">
        <span class="eyebrow">Get started</span>
        <h2>Create your account</h2>
        <div id="error" class="error-banner"></div>
        <form id="register-form">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" required placeholder="Ananya Rao">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@college.edu">
          </div>
          <div class="field">
            <label for="branch">Branch / stream</label>
            <input type="text" id="branch" placeholder="Computer Science">
          </div>
          <div class="field">
            <label for="gradYear">Graduation year</label>
            <input type="number" id="gradYear" placeholder="2026" min="2000" max="2100">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
        </form>
        <p class="center mt-24" style="font-size:0.85rem;">Already have an account? <a href="/pages/login.html">Log in</a></p>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById('register-form');
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      const { token, user } = await Api.register({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        branch: document.getElementById('branch').value.trim(),
        graduationYear: document.getElementById('gradYear').value || null,
      });
      Api.setSession(token, user);
      window.location.href = '/pages/upload-resume.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
