<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password — Placement Readiness Platform</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="page">

  <!-- Header -->
  <header class="container navbar">

    <a
      href="/index.html"
      class="brand"
      style="text-decoration:none;"
    >
      <span class="brand-mark"></span>
      Placement Readiness
    </a>

    <nav class="nav-links">
      <a href="/pages/login.html">
        Back to login
      </a>
    </nav>

  </header>


  <!-- Main -->
  <main class="main">

    <div class="container">

      <div class="auth-shell card">

        <span class="eyebrow">
          Account recovery
        </span>

        <h2>Forgot Password?</h2>

        <p>
          Enter the email address associated with your account
          and we'll help you reset your password.
        </p>


        <!-- Message -->
        <div
          id="message"
          class="error-banner"
        ></div>


        <!-- Form -->
        <form id="forgot-form">

          <div class="field">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              required
              placeholder="you@college.edu"
            >

          </div>


          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="submit-btn"
          >
            Send reset link
          </button>

        </form>


        <!-- Back to login -->
        <p
          class="center mt-24"
          style="font-size:0.85rem;"
        >
          Remember your password?

          <a href="/pages/login.html">
            Log in
          </a>
        </p>

      </div>

    </div>

  </main>

</div>


<!-- API -->
<script src="/js/api.js"></script>


<script>

const form =
  document.getElementById('forgot-form');

const messageEl =
  document.getElementById('message');

const btn =
  document.getElementById('submit-btn');


form.addEventListener('submit', async (e) => {

  e.preventDefault();

  // Hide previous message
  messageEl.classList.remove('show');

  // Disable button
  btn.disabled = true;
  btn.textContent = 'Sending...';


  try {

    const email =
      document
        .getElementById('email')
        .value
        .trim();


    // Call backend
    const result =
      await Api.forgotPassword({
        email: email
      });


    // Show success message
    messageEl.textContent =
      result.message || 'Reset link created successfully.';

    messageEl.classList.add('show');


    /*
      Development/testing mode:

      If your backend returns resetLink,
      show it so you can test the reset process.
    */

    if (result.resetLink) {

      const link =
        document.createElement('a');

      link.href =
        result.resetLink;

      link.textContent =
        'Open password reset page';

      link.style.display =
        'block';

      link.style.marginTop =
        '12px';

      messageEl.appendChild(link);
    }


  } catch (err) {

    messageEl.textContent =
      err.message || 'Unable to process request.';

    messageEl.classList.add('show');

  } finally {

    btn.disabled = false;

    btn.textContent =
      'Send reset link';

  }

});

</script>

</body>
</html>
